  @media (prefers-reduced-motion: reduce) { #tip, .dot { transition: none; } }
</style>

    4:{l:"Onda 4",r:"01/09–14/09"}, 5:{l:"Onda 5",r:"15/09–28/09"}, futuro:{l:"Futuro",r:"contingência"}

  var ITEMS = [

    {n:11,name:"Buscar soluções de pagamento p/ contas de mídia paga",cat:"fundacao",onda:1,cli:"n/a",est:"alto",note:"sem isso nenhuma CA desta onda ativa billing"},

    {n:12,name:"GTM + GA4 instalado",cat:"fundacao",onda:2,cli:"n/a",est:"alto"},
    {n:13,name:"Meta Pixel + Conversions API",cat:"fundacao",onda:2,cli:"n/a",est:"alto"},
    {n:14,name:"TikTok Pixel / Events API",cat:"fundacao",onda:2,cli:"n/a",est:"médio"},
    {n:15,name:"Taxonomia de UTM padronizada",cat:"fundacao",onda:2,cli:"n/a",est:"alto"},
    {n:16,name:"MMP contratado (AppsFlyer/Adjust)",cat:"fundacao",onda:2,cli:"n/a",est:"alto"},
    {n:17,name:"Integração de SDK do MMP nos apps",cat:"fundacao",onda:2,cli:"n/a",est:"alto",note:"depende do time de TI — risco de atraso"},
    {n:18,name:"Estrutura de QR / link curto rastreável",cat:"diferenciacao",onda:2,cli:"médio",p:"M/P",est:"médio",note:"alinhar com Leandro antes de duplicar"},
    {n:19,name:"Deep link / deferred deep link",cat:"diferenciacao",onda:2,cli:"médio",p:"M/P",est:"médio"},
    {n:20,name:"Ponte Codificar → APIs de conversão (n8n)",cat:"fundacao",onda:2,cli:"n/a",est:"alto",note:"alinhar com Dani/TI — mesma frente"},
    {n:21,name:"Dashboard consolidado",cat:"diferenciacao",onda:2,cli:"n/a",est:"alto"},
    {n:22,name:"Taxonomia de comportamento online/offline/bug",cat:"fundacao",onda:2,cli:"n/a",est:"alto",note:"pré-requisito das esteiras"},
    {n:23,name:"Canal Push configurado",cat:"fundacao",onda:2,cli:"alto",p:"M/P",est:"alto"},

    {n:26,name:"SMS fallback configurado",cat:"fundacao",onda:2,cli:"baixo",p:"M/P",est:"baixo"},

    {n:28,name:"Esteira de Ativação (recuperação de corrida falhada)",cat:"diferenciacao",onda:3,cli:"alto",p:"M/P",est:"alto",note:"prioridade nº1 — ataca o funil de usuário online"},

    {n:34,name:"Ajustes de tracking pós-validação",cat:"fundacao",onda:3,cli:"n/a",est:"alto"},
    {n:35,name:"QA final de tracking",cat:"fundacao",onda:3,cli:"n/a",est:"alto"},
    {n:36,name:"Campanha pública de lançamento (passageiro)",cat:"canal",onda:3,cli:"alto",p:"P",est:"alto"},

    {n:37,name:"Ramp-up de campanha de motorista",cat:"canal",onda:4,cli:"alto",p:"M",est:"alto"},
    {n:38,name:"Monitoramento pós-lançamento",cat:"fundacao",onda:4,cli:"n/a",est:"alto"},

    {n:39,name:"Esteira de Retenção / hábito",cat:"diferenciacao",onda:5,cli:"alto",p:"M/P",est:"médio"},
    {n:40,name:"Esteira de Reativação / winback",cat:"diferenciacao",onda:5,cli:"alto",p:"M/P",est:"médio"},
    {n:41,name:"Decidir e implementar holdout de medição",cat:"diferenciacao",onda:5,cli:"n/a",est:"médio"},

    {n:42,name:"BM Cofre completo",cat:"fundacao",onda:3,cli:"n/a",est:"médio",note:"trilha contínua de blindagem desde a Onda 1 — não bloqueia nada"},
    {n:43,name:"Verificação robusta de domínio Meta",cat:"fundacao",onda:3,cli:"n/a",est:"médio",note:"trilha contínua desde a Onda 1"},
    {n:44,name:"D-U-N-S / Play Console — modelo organizacional pleno",cat:"fundacao",onda:3,cli:"n/a",est:"médio",note:"trilha contínua desde a Onda 1"},
    {n:45,name:"BM Reserva (aquecida, dormente)",cat:"fundacao",onda:3,cli:"n/a",est:"baixo",note:"trilha contínua desde a Onda 1"},
    {n:46,name:"Portfólios WABA apartados (formalização completa)",cat:"fundacao",onda:3,cli:"n/a",est:"médio",note:"trilha contínua desde a Onda 1"},
    {n:47,name:"Admins com 2FA + cartão dedicado",cat:"fundacao",onda:3,cli:"n/a",est:"médio",note:"trilha contínua desde a Onda 1"},

    {n:48,name:"Funil de usuários OFFLINE — estrutura de reativação",cat:"naopri",onda:"futuro",cli:"alto",p:"P",est:"médio",note:"contingência: montar a estrutura se o funil online não performar"},
    {n:49,name:"Funil de usuários \"BUG\" — estrutura de recuperação",cat:"naopri",onda:"futuro",cli:"alto",p:"P",est:"médio",note:"contingência: montar se surgirem falhas técnicas relevantes"},
    {n:50,name:"Funil de CHURN completo (4º funil)",cat:"naopri",onda:"futuro",cli:"médio",p:"P",est:"baixo",note:"agrega os dropouts dos funis online, offline e bug — mapeado, não priorizado agora"}
  ];

  // ---- geometria ----
  var OX = 92, OY = 812;
  // AMAX reduzido (82→64): puxa a nuvem proporcionalmente em direção ao eixo horizontal
  // (relevância estratégica), sem alterar a coerência com os eixos.
  var AMIN = 8, AMAX = 64, DOTR = 14;
  var BANDS = { 1:[78,238], 2:[238,372], 3:[372,500], 4:[500,596], 5:[596,700], futuro:[700,796] };
  var ORDER = [1,2,3,4,5,"futuro"];
  var BFILL = {1:"var(--band-1)",2:"var(--band-2)",3:"var(--band-3)",4:"var(--band-4)",5:"var(--band-5)"};

  function rd(d){ return d*Math.PI/180; }
  function XY(a,r){ return { x: OX + r*Math.cos(rd(a)), y: OY - r*Math.sin(rd(a)) }; }
  function mul(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; var t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  var rng = mul(20260721);

  ORDER.forEach(function(key){
    var band = BANDS[key];
    var kk = (key==="futuro")?"futuro":Number(key);
    var group = ITEMS.filter(function(it){ return it.onda===kk; });
    var rMin = band[0]+DOTR+6, rMax = band[1]-DOTR-6; if (rMax<rMin) rMax=rMin;
    var jf = (key===1) ? 0.52 : 0.40;   // Onda 1 um pouco mais desordenada
    group.forEach(function(it){
      var c=W[it.cli], e=W[it.est], t=c/(c+e);
      // coerência com os eixos: +cliente (t alto) → perto do eixo horizontal (ângulo baixo);
      // +estratégico (t baixo) → perto do eixo vertical (ângulo alto)
      var ideal = AMIN + (1-t)*(AMAX-AMIN);
      var jit = (rng()-0.5)*(AMAX-AMIN)*jf;
      it._a = Math.max(AMIN, Math.min(AMAX, ideal+jit));
      it._r = rMin + rng()*(rMax-rMin);
      var p=XY(it._a,it._r); it.x=p.x; it.y=p.y;
    });
    var minD = 2*DOTR + 4;
    for (var iter=0; iter<280; iter++){
      for (var a=0;a<group.length;a++) for (var b=a+1;b<group.length;b++){
        var A=group[a],B=group[b],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);
        if (d>0 && d<minD){ var pu=(minD-d)/2,ux=dx/d,uy=dy/d; A.x-=ux*pu;A.y-=uy*pu;B.x+=ux*pu;B.y+=uy*pu; }
      }
      group.forEach(function(it){
        var dx=it.x-OX,dy=OY-it.y,r=Math.hypot(dx,dy),an=Math.atan2(dy,dx)*180/Math.PI;
        r=Math.max(rMin,Math.min(rMax,r)); an=Math.max(AMIN,Math.min(AMAX,an));
        var p=XY(an,r); it.x=p.x; it.y=p.y;
      });
    }
  });

  // ---- SVG ----
  var NS="http://www.w3.org/2000/svg", svg=document.getElementById("svg");
  function E(t,a){ var e=document.createElementNS(NS,t); for(var k in a) e.setAttribute(k,a[k]); return e; }
  function sector(rOut){ var s=44,p=[],i,a; for(i=0;i<=s;i++){a=90*(i/s);p.push(XY(a,rOut));} p.push({x:OX,y:OY}); return "M "+p.map(function(q){return q.x.toFixed(1)+","+q.y.toFixed(1);}).join(" L ")+" Z"; }
  function arc(r){ var s=44,p=[],i,a; for(i=0;i<=s;i++){a=90*(i/s);p.push(XY(a,r));} return "M "+p.map(function(q){return q.x.toFixed(1)+","+q.y.toFixed(1);}).join(" L "); }

  // defs: degradê radial da faixa Futuro (some pra transparente)
  var defs=E("defs",{});
  var grad=E("radialGradient",{id:"fadeF",gradientUnits:"userSpaceOnUse",cx:OX,cy:OY,r:BANDS.futuro[1]});
  grad.appendChild(E("stop",{offset:(BANDS.futuro[0]/BANDS.futuro[1]).toFixed(3),"stop-color":"#d8c1ec","stop-opacity":"0.9"}));
  grad.appendChild(E("stop",{offset:"1","stop-color":"#d8c1ec","stop-opacity":"0"}));
  defs.appendChild(grad); svg.appendChild(defs);

  // Futuro primeiro (degradê), depois ondas sólidas por cima (da maior p/ menor)
  svg.appendChild(E("path",{d:sector(BANDS.futuro[1]),fill:"url(#fadeF)"}));
  [5,4,3,2,1].forEach(function(k){ svg.appendChild(E("path",{d:sector(BANDS[k][1]),fill:BFILL[k]})); });
  // separadores só das ondas sólidas (Futuro não tem borda)
  [1,2,3,4,5].forEach(function(k){ svg.appendChild(E("path",{d:arc(BANDS[k][1]),class:"band-sep"})); svg.appendChild(E("path",{d:arc(BANDS[k][1]),class:"band-edge"})); });

  // eixos
  var vTop=XY(90,798), hEnd=XY(0,872);
  svg.appendChild(E("line",{x1:OX,y1:OY,x2:OX,y2:vTop.y,class:"axis-line"}));
  svg.appendChild(E("line",{x1:OX,y1:OY,x2:hEnd.x,y2:OY,class:"axis-line"}));
  svg.appendChild(E("path",{d:"M "+OX+" "+(vTop.y-2)+" l -5 10 l 5 -4 l 5 4 z",class:"axis-arrow"}));
  svg.appendChild(E("path",{d:"M "+(hEnd.x+2)+" "+OY+" l -10 -5 l 4 5 l -4 5 z",class:"axis-arrow"}));

  function pole(x,y,s){ svg.appendChild(E("circle",{cx:x,cy:y,r:11,class:"pole"})); var t=E("text",{x:x,y:y+0.5,class:"pole-sign"}); t.textContent=s; svg.appendChild(t); }
  pole(OX, vTop.y-2, "−");
  pole(OX, OY+22, "+");
  pole(OX-24, OY, "+");
  pole(hEnd.x, OY, "−");

  var yt=E("text",{x:32,y:OY-320,class:"axis-title","text-anchor":"middle",transform:"rotate(-90 32 "+(OY-320)+")"});
  yt.textContent="Relevância para o cliente (motorista + passageiro)"; svg.appendChild(yt);
  var xt=E("text",{x:OX+300,y:886,class:"axis-title","text-anchor":"middle"});
  xt.textContent="Relevância estratégica (objetivos da empresa)"; svg.appendChild(xt);

  // rótulos das ondas (na base) — bandas externas alargadas p/ não sobrepor
  ORDER.forEach(function(key){
    var b=BANDS[key], rMid=(b[0]+b[1])/2, pos=XY(2.0,rMid);
    var l=E("text",{x:pos.x,y:OY+24,class:"band-label"}); l.textContent=ONDA[key].l.toUpperCase(); svg.appendChild(l);
    var s=E("text",{x:pos.x,y:OY+35,class:"band-label-sub"}); s.textContent=ONDA[key].r; svg.appendChild(s);
  });

  // tooltip
  var tip=document.getElementById("tip");
  function showTip(it){
    var pp=it.p?(" · "+it.p):"";
    tip.innerHTML='<div class="t-t">'+it.n+'. '+it.name+'</div>'+
      '<div class="t-m">'+ONDA[it.onda].l+' · '+ONDA[it.onda].r+' · '+CAT[it.cat].label+'<br>Cliente: '+it.cli+pp+' · Estratégico: '+it.est+'</div>'+
      (it.note?'<div class="t-n">'+it.note+'</div>':'');
    tip.classList.add("show");
  }
  function moveTip(x,y){ var w=272,h=tip.offsetHeight||120; tip.style.left=Math.min(x+15,window.innerWidth-w-8)+"px"; tip.style.top=Math.min(Math.max(8,y+15),window.innerHeight-h-8)+"px"; }
  function hideTip(){ tip.classList.remove("show"); }
  function dim(n,on){ document.querySelectorAll("g.node").forEach(function(g){ g.classList.toggle("dim", on && g.dataset.n!==String(n)); }); document.querySelectorAll(".li").forEach(function(li){ li.classList.toggle("on", on && li.dataset.n===String(n)); }); }

  ITEMS.forEach(function(it){
    var g=E("g",{class:"node",tabindex:"0",role:"img","aria-label":it.n+". "+it.name+" — "+ONDA[it.onda].l});
    g.dataset.n=it.n;
    g.appendChild(E("circle",{cx:it.x,cy:it.y,r:DOTR+6,class:"dot-hit"}));
    g.appendChild(E("circle",{cx:it.x,cy:it.y,r:DOTR,class:"dot",fill:CAT[it.cat].color}));
    var num=E("text",{x:it.x,y:it.y+0.5,class:"dot-num"}); num.textContent=it.n; g.appendChild(num);
    g.addEventListener("mouseenter",function(){ showTip(it); dim(it.n,true); });
    g.addEventListener("mousemove",function(e){ moveTip(e.clientX,e.clientY); });
    g.addEventListener("mouseleave",function(){ hideTip(); dim(it.n,false); });
    g.addEventListener("focus",function(){ showTip(it); dim(it.n,true); var r=g.getBoundingClientRect(); moveTip(r.left+r.width/2,r.top+r.height/2); });
    g.addEventListener("blur",function(){ hideTip(); dim(it.n,false); });
    svg.appendChild(g);
  });

  // legenda
  var legend=document.getElementById("legend");
  ["fundacao","diferenciacao","canal","oportunidade","naopri"].forEach(function(ck){
    var items=ITEMS.filter(function(it){return it.cat===ck;});
    if(!items.length) return;
    var card=document.createElement("div"); card.className="cat";
    var head=document.createElement("div"); head.className="cat-head";
    head.innerHTML='<span class="dotmark" style="background:'+CAT[ck].color+'"></span>'+CAT[ck].label+'<span class="count">'+items.length+'</span>';
    var body=document.createElement("div"); body.className="cat-items"+(items.length<=3?" one":"");
    items.forEach(function(it){
      var li=document.createElement("div"); li.className="li"; li.dataset.n=it.n;
      var tag=it.p?' <span class="li-tag">('+it.p+')</span>':'';
      li.innerHTML='<span class="li-n">'+it.n+'</span><span>'+it.name+tag+'</span>';
      li.addEventListener("mouseenter",function(){ li.classList.add("on"); dim(it.n,true); });
      li.addEventListener("mouseleave",function(){ li.classList.remove("on"); dim(it.n,false); });
      body.appendChild(li);
    });
    card.appendChild(head); card.appendChild(body); legend.appendChild(card);
  });
  var foot=document.createElement("div"); foot.className="foot";
  foot.textContent="Passe o mouse (ou navegue com Tab) sobre qualquer número — no mapa ou na lista — para ver os detalhes da demanda.";
  legend.appendChild(foot);
})();
</script>
